services:
  ros2_dev_container:
    build:
    # Set the context to the working directory.
      context: .
      dockerfile: docker/Dockerfile.ros2
    network_mode: host
    ipc: host
    stdin_open: true 
    tty: true  
    privileged: true

    volumes:
      # Mount the contents of the directory source into the container src.
      - ./src:/ros2_ws/src:r