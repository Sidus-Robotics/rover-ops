# From: https://github.com/ros-tooling/action-ros-ci-template/blob/master/.github/workflows/lint.yml
# Re-configured for workspace instead of single package
name: Lint ROS 2 Workspace
on:
  # pull_request:
  push:
    # branches:
    #   - main

jobs:
  ament_lint_workspace:
    name: ament_${{ matrix.linter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cppcheck excluded due to performance issues noted in ament_lint/pull/345
        linter: [cpplint, uncrustify, xmllint, flake8, pep257]
    steps:
      - uses: actions/checkout@v4

      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - uses: ros-tooling/action-ros-lint@v0.1
        with:
          linter: ${{ matrix.linter }}
          sub-path: src