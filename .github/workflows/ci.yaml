# Check build status of the ROS2 packages.

on: 
  push:

# Grabbed from https://github.com/ros-tooling/action-ros-ci
jobs:
  build_and_test_ros2:
    runs-on: ubuntu-latest
    container:
        image: ros:jazzy-ros-base
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      
      # - uses: ros-tooling/setup-ros@v0.7
      #   with:
      #     required-ros-distributions: jazzy
      
      # Temp
      - name: Check ROS Python path
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          echo "PYTHONPATH=$PYTHONPATH"
          /usr/bin/python3 -c 'import sys, ament_package; print("Python search path:", sys.path); print("ament_package:", ament_package.__file__)'
          
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          import-token: ${{ secrets.GITHUB_TOKEN }}
          target-ros2-distro: jazzy
          # Skip dependencies that you know work but the build tweaks
          rosdep-skip-keys: "libcamera CppLinuxSerial IXWebSocket Threads"
      # - run: colcon build