services:
  ros2_dev_container:
    network_mode: host
    ipc: host
    stdin_open: true 
    tty: true  
    privileged: true

    # Pass in env variables for display.
    environment:
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount the contents of the directory source into the container src.
      - ./src:/ros2_ws/src:r
      - /dev/bus/usb:/dev/bus/usb:rw
      - /dev/dri:/dev/dri:rw

    # command: bash -c
