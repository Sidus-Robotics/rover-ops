# https://docs.astral.sh/ruff/linter/

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []
per-file-ignores = { "__init__.py" = ["F401"] }
exclude = ["ground_station/"]

[tool.ruff.lint.isort]
# Groups standard library, third-party (like rclpy), and local ROS nodes correctly
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
forced-separate = ["rclpy"]
