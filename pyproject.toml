[project]
name = "ground-station"
version = "0.0.1"
description = "Mission control, ground station control software"
dependencies = [
    "websockets",
    "pygame-ce",
    "pyserial",
    "fastapi[standard]",
    "pydantic",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.fastapi]
entrypoint = "web_server:app"

# https://docs.astral.sh/ruff/linter/
[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = []
per-file-ignores = { "__init__.py" = ["F401"] }
exclude = ["ground_station/*.py", "src/"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]
forced-separate = ["rclpy"]
